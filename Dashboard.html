<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>My Sales Dashboard</title>
<script src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blue:   #2563eb;
    --purple: #7c3aed;
    --red:    #dc2626;
    --green:  #16a34a;
    --dark:   #1a1a2e;
    --bg:     #f4f4f5;
    --card:   #ffffff;
    --border: #e4e4e7;
    --text:   #18181b;
    --muted:  #71717a;
    --radius: 10px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--text); font-size: 14px;
         height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }

  /* ── Loading ─────────────────────────────────────────────────────────────── */
  #loading { position: fixed; inset: 0; background: var(--bg);
             display: flex; flex-direction: column; align-items: center;
             justify-content: center; gap: 14px; z-index: 999; }
  .spinner { width: 36px; height: 36px; border: 3px solid var(--border);
             border-top-color: var(--blue); border-radius: 50%;
             animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Error ───────────────────────────────────────────────────────────────── */
  #error-view { position: fixed; inset: 0; background: var(--bg);
                display: flex; flex-direction: column; align-items: center;
                justify-content: center; padding: 28px; text-align: center;
                z-index: 998; }
  .err-icon { font-size: 48px; margin-bottom: 14px; }
  .err-box  { background: #fef2f2; border: 1px solid #fecaca; border-radius: var(--radius);
              padding: 14px 16px; color: #b91c1c; font-size: 13px; line-height: 1.6;
              white-space: pre-wrap; margin-bottom: 16px; width: 100%; max-width: 360px; }
  .retry-btn { padding: 10px 28px; background: var(--blue); color: white; border: none;
               border-radius: var(--radius); font-size: 14px; font-weight: 600; cursor: pointer; }

  /* ── Header ──────────────────────────────────────────────────────────────── */
  .header { background: var(--dark); color: white; padding: 12px 14px;
            flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; }
  .header h1  { font-size: 15px; font-weight: 700; }
  .header-sub { font-size: 11px; color: #aaa; margin-top: 2px; }
  .refresh-btn { background: rgba(255,255,255,.12); border: none; color: white;
                 padding: 5px 11px; border-radius: 6px; font-size: 12px; cursor: pointer; }
  .refresh-btn:active { background: rgba(255,255,255,.22); }

  /* ── Purch banner ────────────────────────────────────────────────────────── */
  #purch-banner { background: #fefce8; border-bottom: 1px solid #fde047;
                  padding: 6px 14px; font-size: 12px; color: #854d0e;
                  flex-shrink: 0; display: none; }

  /* ── Filter bar ──────────────────────────────────────────────────────────── */
  .filter-bar { background: white; border-bottom: 1px solid var(--border);
                padding: 8px 10px; flex-shrink: 0; }
  .type-tabs  { display: flex; gap: 5px; margin-bottom: 7px; }
  .tab { flex: 1; padding: 5px 4px; border: 1.5px solid #e0e0e0; background: #fafafa;
         border-radius: 8px; cursor: pointer; font-size: 12px; text-align: center;
         font-weight: 600; color: #666; }
  .tab.active { background: var(--dark); color: white; border-color: var(--dark); }
  .tab .cnt   { font-size: 11px; opacity: .75; margin-left: 2px; }
  .filter-row { display: flex; gap: 6px; }
  .filter-row select, .filter-row input {
    flex: 1; padding: 6px 9px; border: 1.5px solid var(--border);
    border-radius: 8px; font-size: 13px; background: white;
    -webkit-appearance: none; }

  /* ── Card list ───────────────────────────────────────────────────────────── */
  #list-view { flex: 1; overflow-y: auto; padding: 10px 10px 80px; }
  .empty-state { text-align: center; padding: 50px 20px; color: var(--muted); }
  .empty-state .ei { font-size: 40px; margin-bottom: 12px; }

  .card { background: var(--card); border-radius: var(--radius);
          margin-bottom: 8px; border-left: 4px solid #ccc;
          padding: 11px 13px; cursor: pointer;
          box-shadow: 0 1px 3px rgba(0,0,0,.06);
          transition: box-shadow .15s, transform .1s; }
  .card:active { transform: scale(.99); }
  .card.c-pending   { border-left-color: var(--blue); }
  .card.c-reprocess { border-left-color: var(--purple); }
  .card.c-recovery  { border-left-color: var(--red); }

  .card-top    { display: flex; align-items: flex-start; gap: 7px; }
  .card-main   { flex: 1; min-width: 0; }
  .card-name   { font-weight: 700; font-size: 14px;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-cut    { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .card-right  { display: flex; flex-direction: column; align-items: flex-end;
                 gap: 4px; flex-shrink: 0; }
  .type-badge  { font-size: 11px; padding: 2px 7px; border-radius: 20px; font-weight: 700; }
  .tb-pending   { background: #eff6ff; color: var(--blue); }
  .tb-reprocess { background: #f5f3ff; color: var(--purple); }
  .tb-recovery  { background: #fef2f2; color: var(--red); }

  .card-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .card-date   { font-size: 11px; color: var(--muted); }
  .action-tag  { font-size: 11px; color: #c2410c; background: #fff7ed;
                 border-radius: 20px; padding: 2px 8px; max-width: 180px;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Status pills */
  .pill { display: inline-block; border-radius: 20px; padding: 2px 9px;
          font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
  .p-default    { background: #f4f4f5; color: #71717a; }
  .p-won,.p-wonback,.p-recovered,.p-launched,.p-ready
                { background: #f0fdf4; color: #16a34a; }
  .p-lost,.p-gaveup,.p-declined
                { background: #fef2f2; color: #dc2626; }
  .p-inprogress,.p-attempting,.p-inproduction
                { background: #eff6ff; color: #2563eb; }
  .p-closed     { background: #f4f4f5; color: #52525b; }
  .p-pending    { background: #f5f3ff; color: #7c3aed; }

  /* ── Detail view ─────────────────────────────────────────────────────────── */
  #detail-wrap { position: fixed; inset: 0; background: var(--bg);
                 display: flex; flex-direction: column; z-index: 100;
                 transform: translateX(100%); transition: transform .25s ease; }
  #detail-wrap.open { transform: translateX(0); }

  .det-header { background: var(--dark); color: white; padding: 10px 14px;
                display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .back-btn   { background: rgba(255,255,255,.12); border: none; color: white;
                padding: 5px 11px; border-radius: 6px; font-size: 12px; cursor: pointer; }
  .det-title  { font-weight: 700; font-size: 14px; flex: 1;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #detail-body { flex: 1; overflow-y: auto; padding: 10px 10px 20px; }

  /* Accordion sections */
  .sec { background: var(--card); border-radius: var(--radius);
         margin-bottom: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.06); overflow: hidden; }
  .sec-hd { padding: 11px 13px; font-weight: 700; font-size: 13px;
            cursor: pointer; display: flex; justify-content: space-between;
            align-items: center; user-select: none; }
  .sec-hd:active { background: #f4f4f5; }
  .chev { font-size: 11px; transition: transform .2s; }
  .chev.open { transform: rotate(180deg); }
  .sec-bd { padding: 8px 13px 13px; border-top: 1px solid var(--border); }
  .sec-bd.collapsed { display: none; }

  .sec.edit-sec .sec-hd  { background: #fefce8; }
  .sec.purch-sec.has-data .sec-hd { background: #eff6ff; color: var(--blue); }

  /* Field grid */
  .fg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
  .fi { min-width: 0; }
  .fi.full { grid-column: 1 / -1; }
  .fl { font-size: 10px; color: var(--muted); text-transform: uppercase;
        letter-spacing: .05em; margin-bottom: 2px; }
  .fv { font-size: 13px; color: var(--text); word-break: break-word; }
  .fv.empty { color: #d1d5db; }

  /* Edit fields */
  .ef { margin-bottom: 11px; }
  .ef label { display: block; font-size: 12px; font-weight: 600;
              color: var(--muted); margin-bottom: 4px; }
  .ef input, .ef select, .ef textarea {
    width: 100%; padding: 9px 11px; border: 1.5px solid var(--border);
    border-radius: 8px; font-size: 14px; font-family: inherit;
    background: white; -webkit-appearance: none; }
  .ef input:focus, .ef select:focus, .ef textarea:focus {
    outline: none; border-color: var(--blue); }
  .ef textarea { resize: vertical; min-height: 72px; }

  .save-btn { width: 100%; padding: 13px; background: var(--green); color: white;
              border: none; border-radius: var(--radius); font-size: 15px;
              font-weight: 700; cursor: pointer; margin-top: 6px; }
  .save-btn:active   { background: #15803d; }
  .save-btn:disabled { background: #9ca3af; cursor: not-allowed; }

  /* ── Toast ───────────────────────────────────────────────────────────────── */
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
           background: #18181b; color: white; padding: 9px 20px;
           border-radius: 999px; font-size: 13px; opacity: 0;
           transition: opacity .3s; z-index: 999; white-space: nowrap; pointer-events: none; }
  #toast.show { opacity: 1; }
  #toast.ok    { background: var(--green); }
  #toast.error { background: var(--red); }
</style>
</head>
<body>

<!-- ── CONFIG ───────────────────────────────────────────────────────────────── -->
<!-- Update both values after deploying a new GAS version or creating the LIFF app -->
<script>
const GAS_URL       = "https://script.google.com/macros/s/AKfycbydXQlz-A_ZbkQbxsmcZ8lwN2CjjQxcb17HQqm1h-wUA344zpkPpwItSj1fB089Kz6Y/exec";
const DASHBOARD_LIFF_ID = "2009974531-fcu9AW7m";
</script>

<div id="loading">
  <div class="spinner"></div>
  <span style="color:var(--muted);font-size:13px">Loading…</span>
</div>

<div id="error-view" style="display:none">
  <div class="err-icon">⚠️</div>
  <div class="err-box" id="err-text"></div>
  <button class="retry-btn" onclick="startApp()">Retry</button>
</div>

<!-- Header (hidden until data loads) -->
<div id="top-bar" style="display:none">
  <div class="header">
    <div>
      <h1>🥩 My Sales Dashboard</h1>
      <div class="header-sub" id="hdr-name"></div>
    </div>
    <button class="refresh-btn" onclick="refresh()">↻ Refresh</button>
  </div>

  <div id="purch-banner">🔔 <span id="purch-count"></span> row(s) have purchasing updates</div>

  <div class="filter-bar">
    <div class="type-tabs">
      <button class="tab active" data-t="all"       onclick="setTab(this,'all')">All <span class="cnt" id="cn-all">0</span></button>
      <button class="tab"        data-t="pending"   onclick="setTab(this,'pending')">📋 <span class="cnt" id="cn-pending">0</span></button>
      <button class="tab"        data-t="reprocess" onclick="setTab(this,'reprocess')">⚙️ <span class="cnt" id="cn-reprocess">0</span></button>
      <button class="tab"        data-t="recovery"  onclick="setTab(this,'recovery')">💔 <span class="cnt" id="cn-recovery">0</span></button>
    </div>
    <div class="filter-row">
      <select id="sf" onchange="render()">
        <option value="">All statuses</option>
        <option value="active">Active</option>
        <option value="won">Won / Recovered</option>
        <option value="lost">Lost / Gave Up</option>
        <option value="closed">Closed / Declined</option>
      </select>
      <input id="sq" type="search" placeholder="Search customer…" oninput="render()">
    </div>
  </div>
</div>

<div id="list-view" style="display:none"></div>

<!-- Detail panel (slides in from right) -->
<div id="detail-wrap">
  <div class="det-header">
    <button class="back-btn" onclick="closeDetail()">← Back</button>
    <div class="det-title" id="det-title"></div>
  </div>
  <div id="detail-body"></div>
</div>

<div id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────────
let lineUserId   = null;
let displayName  = null;
let allRows      = [];
let activeTab    = "all";
let currentRow   = null;

// ── Boot ───────────────────────────────────────────────────────────────────────
window.addEventListener("load", startApp);

async function startApp() {
  showLoading(true);
  try {
    await Promise.race([
      liff.init({ liffId: DASHBOARD_LIFF_ID }),
      timeout(12000, "LIFF init timed out"),
    ]);

    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    const profile = await liff.getProfile();
    lineUserId   = profile.userId;
    displayName  = profile.displayName || "LINE User";

    document.getElementById("hdr-name").textContent = displayName;
    await loadDashboard();
  } catch (err) {
    showError("Could not initialise LINE login.\n\n" + err.message +
              "\n\nPlease open this page from the LINE app.");
  }
}

async function loadDashboard() {
  showLoading(true);
  try {
    const result = await jsonpCall(GAS_URL + "?action=getDashboard&lineUserId=" + encodeURIComponent(lineUserId));
    if (result.error) throw new Error(result.error);
    allRows = result.rows || [];
    updateCounts();
    render();
    document.getElementById("top-bar").style.display = "block";
    document.getElementById("list-view").style.display = "block";
    showLoading(false);
  } catch (err) {
    showError("Failed to load dashboard:\n\n" + err.message);
  }
}

async function refresh() {
  await loadDashboard();
}

// ── List rendering ─────────────────────────────────────────────────────────────
function updateCounts() {
  const counts = { all:0, pending:0, reprocess:0, recovery:0 };
  allRows.forEach(r => { counts.all++; if (counts[r.type] !== undefined) counts[r.type]++; });
  Object.keys(counts).forEach(k => {
    const el = document.getElementById("cn-" + k);
    if (el) el.textContent = counts[k];
  });

  const purchRows = allRows.filter(r => r.hasPurchUpdate).length;
  const banner = document.getElementById("purch-banner");
  document.getElementById("purch-count").textContent = purchRows;
  banner.style.display = purchRows > 0 ? "block" : "none";
}

function setTab(el, type) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  el.classList.add("active");
  activeTab = type;
  render();
}

function render() {
  const sf = document.getElementById("sf").value;
  const sq = (document.getElementById("sq").value || "").toLowerCase().trim();
  const list = document.getElementById("list-view");
  list.innerHTML = "";

  const filtered = allRows.filter(r => {
    if (activeTab !== "all" && r.type !== activeTab) return false;
    if (sq && !(r.customer || "").toLowerCase().includes(sq)) return false;
    if (sf) {
      const s = (r.status || "").toLowerCase().replace(/[\s\/]+/g,"");
      if (sf === "active"  && !["pending","inprogress","attempting","inproduction","ready"].includes(s)) return false;
      if (sf === "won"     && !["won","wonback","recovered","launched"].includes(s)) return false;
      if (sf === "lost"    && !["lost","gaveup"].includes(s)) return false;
      if (sf === "closed"  && !["closed","declined"].includes(s)) return false;
    }
    return true;
  });

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="ei">📭</div>' +
      '<div>No records found.</div>' +
      '<div style="font-size:12px;margin-top:6px;color:#aaa">Submit forms via LINE to see them here.</div></div>';
    return;
  }

  filtered.forEach(row => {
    const card = document.createElement("div");
    card.className = "card c-" + row.type;
    card.innerHTML =
      '<div class="card-top">' +
        '<div class="card-main">' +
          '<div class="card-name">' + esc(row.customer || "—") + '</div>' +
          '<div class="card-cut">' + esc(row.cut || "—") + '</div>' +
        '</div>' +
        '<div class="card-right">' +
          '<span class="type-badge tb-' + row.type + '">' + esc(row.typeLabel) + '</span>' +
          (row.hasPurchUpdate ? '<span style="font-size:15px" title="Purchasing has updated">🔔</span>' : '') +
        '</div>' +
      '</div>' +
      '<div class="card-bottom">' +
        '<span class="card-date">' + esc(row.date) + '</span>' +
        (row.status
          ? '<span class="pill ' + pillClass(row.status) + '">' + esc(row.status) + '</span>'
          : '<span class="pill p-default">—</span>') +
      '</div>' +
      (row.actionRequired
        ? '<div class="action-tag" style="margin-top:6px">▶ ' + esc(row.actionRequired) + '</div>'
        : '');
    card.onclick = () => openDetail(row);
    list.appendChild(card);
  });
}

// ── Detail view ────────────────────────────────────────────────────────────────
function openDetail(row) {
  currentRow = row;
  document.getElementById("det-title").textContent = row.typeLabel + " · " + (row.customer || "—");

  const body = document.getElementById("detail-body");
  body.innerHTML = "";

  // Section 1: Sales submission (read-only, collapsed)
  body.appendChild(makeSec("📝 Your Submission", makeFieldGrid(row.readonlySales), false, false));

  // Section 2: Purchasing response (read-only)
  const hasPurch = row.readonlyPurch.some(f => (f.value || "").trim() !== "");
  const purchSec = makeSec(
    "📦 Purchasing Response" + (row.hasPurchUpdate ? " 🔔" : ""),
    hasPurch ? makeFieldGrid(row.readonlyPurch)
             : '<p style="color:var(--muted);font-size:13px;padding:4px 0">Awaiting response…</p>',
    !hasPurch, !hasPurch
  );
  purchSec.classList.add("purch-sec");
  if (hasPurch) purchSec.classList.add("has-data");
  body.appendChild(purchSec);

  // Section 3: Editable (open)
  const editWrap = makeEditFields(row.editFieldsDefs, row.editValues);
  const saveBtn  = document.createElement("button");
  saveBtn.className  = "save-btn";
  saveBtn.textContent = "Save";
  saveBtn.onclick = saveDetail;
  editWrap.appendChild(saveBtn);

  const editSec = makeSec("✏️ Your Update", editWrap, true, false);
  editSec.classList.add("edit-sec");
  body.appendChild(editSec);

  document.getElementById("detail-wrap").classList.add("open");
}

function closeDetail() {
  document.getElementById("detail-wrap").classList.remove("open");
  currentRow = null;
}

function makeSec(title, content, startOpen, startCollapsed) {
  const sec = document.createElement("div");
  sec.className = "sec";

  const hd = document.createElement("div");
  hd.className = "sec-hd";
  hd.innerHTML = '<span>' + title + '</span><span class="chev' + (startOpen ? ' open' : '') + '">▼</span>';

  const bd = document.createElement("div");
  bd.className = "sec-bd" + (startCollapsed ? " collapsed" : "");
  if (typeof content === "string") bd.innerHTML = content;
  else bd.appendChild(content);

  hd.onclick = () => {
    bd.classList.toggle("collapsed");
    hd.querySelector(".chev").classList.toggle("open");
  };

  sec.appendChild(hd);
  sec.appendChild(bd);
  return sec;
}

function makeFieldGrid(fields) {
  const grid = document.createElement("div");
  grid.className = "fg";
  fields.forEach(f => {
    const wide = (f.label.length > 14) || ((f.value || "").length > 25);
    const item = document.createElement("div");
    item.className = "fi" + (wide ? " full" : "");
    item.innerHTML = '<div class="fl">' + esc(f.label) + '</div>' +
      '<div class="fv' + (!f.value ? ' empty' : '') + '">' + esc(f.value || "—") + '</div>';
    grid.appendChild(item);
  });
  return grid;
}

function makeEditFields(defs, values) {
  const wrap = document.createElement("div");
  defs.forEach(def => {
    const div = document.createElement("div");
    div.className = "ef";
    const val = values[def.col] || "";

    if (def.type === "select") {
      const opts = ['<option value="">— select —</option>']
        .concat(def.options.map(o => '<option value="' + esc(o) + '"' + (o === val ? " selected" : "") + '>' + esc(o) + '</option>'))
        .join("");
      div.innerHTML = '<label>' + esc(def.label) + '</label><select data-col="' + def.col + '">' + opts + '</select>';
    } else if (def.type === "textarea") {
      div.innerHTML = '<label>' + esc(def.label) + '</label>' +
        '<textarea data-col="' + def.col + '" maxlength="400">' + esc(val) + '</textarea>';
    } else if (def.type === "date") {
      div.innerHTML = '<label>' + esc(def.label) + '</label>' +
        '<input type="date" data-col="' + def.col + '" value="' + esc(val) + '">';
    } else {
      div.innerHTML = '<label>' + esc(def.label) + '</label>' +
        '<input type="text" data-col="' + def.col + '" value="' + esc(val) + '" maxlength="200">';
    }
    wrap.appendChild(div);
  });
  return wrap;
}

async function saveDetail() {
  if (!currentRow || !lineUserId) return;

  const btn = document.querySelector(".save-btn");
  btn.disabled = true;
  btn.textContent = "Saving…";

  // Build params: col_14=Won, col_15=..., etc.
  const updates = {};
  document.querySelectorAll("#detail-body [data-col]").forEach(el => {
    updates["col_" + el.dataset.col] = el.value || "";
  });

  try {
    const params = new URLSearchParams({
      action:     "saveRow",
      lineUserId: lineUserId,
      type:       currentRow.type,
      rowIndex:   currentRow.rowIndex,
      ...updates,
    });
    const result = await jsonpCall(GAS_URL + "?" + params.toString());
    if (!result.success) throw new Error(result.error || "Save failed");

    // Update local state so list reflects new values without a full refresh
    const idx = allRows.findIndex(r => r.type === currentRow.type && r.rowIndex === currentRow.rowIndex);
    if (idx !== -1) {
      const statusDef = currentRow.editFieldsDefs.find(f => f.type === "select");
      const actionDef = currentRow.editFieldsDefs.find(f => f.label === "Action Required");
      if (statusDef && updates["col_" + statusDef.col] !== undefined)
        allRows[idx].status = updates["col_" + statusDef.col];
      if (actionDef && updates["col_" + actionDef.col] !== undefined)
        allRows[idx].actionRequired = updates["col_" + actionDef.col];
    }

    showToast("✓ Saved", "ok");
    btn.disabled = false;
    btn.textContent = "Save";
  } catch (err) {
    showToast("❌ " + err.message, "error");
    btn.disabled = false;
    btn.textContent = "Save";
  }
}

// ── JSONP (bypasses CORS — same approach as the form) ─────────────────────────
function jsonpCall(url) {
  return new Promise((resolve, reject) => {
    const fn     = "cb_" + Date.now();
    const script = document.createElement("script");
    const timer  = setTimeout(() => { cleanup(); reject(new Error("GAS timeout")); }, 15000);
    window[fn]   = data => { clearTimeout(timer); cleanup(); resolve(data); };
    script.onerror = () => { clearTimeout(timer); cleanup(); reject(new Error("GAS unreachable — check deployment URL")); };
    function cleanup() { delete window[fn]; script.parentNode && script.parentNode.removeChild(script); }
    script.src = url + (url.includes("?") ? "&" : "?") + "callback=" + fn;
    document.head.appendChild(script);
  });
}

function timeout(ms, msg) {
  return new Promise((_, reject) => setTimeout(() => reject(new Error(msg)), ms));
}

// ── Helpers ────────────────────────────────────────────────────────────────────
function showLoading(on) {
  document.getElementById("loading").style.display = on ? "flex" : "none";
  document.getElementById("error-view").style.display = "none";
}

function showError(msg) {
  document.getElementById("loading").style.display = "none";
  document.getElementById("error-view").style.display = "flex";
  document.getElementById("err-text").textContent = msg;
}

function showToast(msg, type) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "show " + (type || "");
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = ""; }, 3000);
}

function esc(s) {
  return String(s || "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function pillClass(status) {
  const k = (status || "").toLowerCase().replace(/[\s\/]+/g,"");
  return { won:"p-won",wonback:"p-wonback",recovered:"p-recovered",launched:"p-launched",
           ready:"p-ready",lost:"p-lost",gaveup:"p-gaveup",declined:"p-declined",
           inprogress:"p-inprogress",attempting:"p-attempting",inproduction:"p-inproduction",
           closed:"p-closed",pending:"p-pending" }[k] || "p-default";
}
