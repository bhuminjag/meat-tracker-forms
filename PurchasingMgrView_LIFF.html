<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Purchasing Manager Dashboard</title>
<script src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#dc2626;--orange:#ea580c;--yellow:#ca8a04;--green:#16a34a;
  --blue:#2563eb;--dark:#1e293b;--bg:#f1f5f9;--card:#fff;
  --border:#e2e8f0;--text:#1e293b;--muted:#64748b;--r:8px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;background:var(--bg);color:var(--text);min-height:100vh}
#loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:80vh;gap:12px}
.spin{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#error-view{padding:24px;text-align:center}
.err-box{background:#fef2f2;border:1px solid #fecaca;border-radius:var(--r);padding:14px;color:#b91c1c;font-size:13px;line-height:1.6;white-space:pre-wrap;margin-top:12px}

/* Header */
#hdr{background:var(--dark);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
#hdr h1{font-size:13px;font-weight:700}
#hdr .sub{font-size:11px;color:#94a3b8;margin-top:2px}
.refresh-btn{background:rgba(255,255,255,.15);border:none;color:#fff;padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer}

/* Summary bar */
#summary-bar{display:flex;gap:6px;flex-wrap:wrap;padding:8px 10px;background:#fff;border-bottom:1px solid var(--border)}
.badge{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;cursor:pointer}
.badge-red   {background:#fee2e2;color:var(--red)}
.badge-yellow{background:#fef9c3;color:var(--yellow)}
.badge-green {background:#dcfce7;color:var(--green)}
.badge-blue  {background:#dbeafe;color:var(--blue)}
.badge-gray  {background:#f1f5f9;color:var(--muted)}

/* Person cards */
#content{padding:8px 8px 80px}
.person-card{background:var(--card);border-radius:var(--r);margin-bottom:8px;overflow:hidden;border-left:4px solid var(--border)}
.person-card.has-overdue{border-left-color:var(--red)}
.person-card.has-today  {border-left-color:var(--yellow)}
.person-card.all-ok     {border-left-color:var(--green)}
.pc-hdr{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:#f8fafc;border-bottom:1px solid var(--border)}
.pc-hdr:hover{background:#f1f5f9}
.pc-name{font-weight:700;font-size:13px}
.pc-stats{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pc-body{display:none;padding:8px 12px}
.pc-body.open{display:block}

.group-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:8px 0 4px;padding-bottom:3px;border-bottom:1px solid var(--border)}
.item{padding:6px 0;border-bottom:1px solid #f8fafc;cursor:pointer}
.item:last-child{border-bottom:none}
.item:hover{background:#eff6ff}
.item-top{display:flex;justify-content:space-between;align-items:flex-start}
.item-customer{font-weight:600;font-size:12px;color:var(--blue);text-decoration:underline;text-decoration-style:dotted}
.item-days{font-size:12px;font-weight:700}
.item-days.overdue{color:var(--red)} .item-days.today{color:var(--yellow)} .item-days.ok{color:var(--green)}
.item-sub{font-size:11px;color:var(--muted);margin-top:1px}
.item-ps{display:inline-block;padding:1px 6px;background:#f1f5f9;border-radius:4px;font-size:10px;color:var(--muted);margin-top:2px}

/* Bottleneck section */
.section{background:var(--card);margin:0 0 8px;border-radius:var(--r);overflow:hidden}
.sec-hdr{padding:10px 12px;font-size:12px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;background:#f8fafc;border-bottom:1px solid var(--border)}
.sec-hdr:hover{background:#f1f5f9}
.sec-body{padding:10px 12px;display:none}
.sec-body.open{display:block}

/* Drill panel */
#dp{position:fixed;inset:0;background:var(--bg);z-index:300;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease}
#dp.open{transform:translateX(0)}
#dp-hdr{background:var(--dark);color:#fff;padding:8px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0}
#dp-back{background:rgba(255,255,255,.15);border:none;color:#fff;padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer}
#dp-crumb{font-size:11px;color:#94a3b8;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dp-body{flex:1;overflow-y:auto;padding:10px}

/* Toast */
#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:7px 16px;border-radius:999px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;z-index:999}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="loading"><div class="spin"></div><span style="color:#888;font-size:13px">Loading…</span></div>
<div id="error-view" style="display:none"></div>
<div id="main" style="display:none">
  <div id="hdr">
    <div><h1>📦 Purchasing Manager</h1><div class="sub" id="hdr-sub"></div></div>
    <button class="refresh-btn" onclick="loadDashboard(true)">↻</button>
  </div>
  <div id="summary-bar"></div>
  <div id="content"></div>
</div>

<div id="dp">
  <div id="dp-hdr">
    <button id="dp-back" onclick="drillBack()">← Back</button>
    <div id="dp-crumb"></div>
  </div>
  <div id="dp-body"></div>
</div>
<div id="toast"></div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbydXQlz-A_ZbkQbxsmcZ8lwN2CjjQxcb17HQqm1h-wUA344zpkPpwItSj1fB089Kz6Y/exec";
const LIFF_ID = "REPLACE_WITH_PM_LIFF_ID";  // ← fill in after creating LIFF app

var D = {};
var lineUserId = "";
var DRILL = [];
var STACK = [];
var SAVED_SCROLL = 0;

// ── Bootstrap ──────────────────────────────────────────────────────────────────
window.addEventListener("load", async function() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (liff.isLoggedIn()) {
      const p = await liff.getProfile();
      lineUserId = p.userId;
    }
  } catch(e) { console.warn("LIFF init failed:", e.message); }

  if (!lineUserId) {
    showError("Could not get your LINE identity.\nPlease open this dashboard from LINE.");
    return;
  }
  loadDashboard(false);
});

function loadDashboard(forceRefresh) {
  document.getElementById("loading").style.display = "flex";
  document.getElementById("main").style.display = "none";

  var timeout = setTimeout(function() {
    showError("Dashboard took too long to load. Please try again.");
  }, 45000);

  var url = GAS_URL + "?action=getPurchasingManagerData&lineUserId=" +
            encodeURIComponent(lineUserId) + (forceRefresh ? "&refresh=1" : "");

  jsonpCall(url)
    .then(function(data) {
      clearTimeout(timeout);
      if (data.error) { showError(data.error); return; }
      try {
        D = data;
        DRILL = [];
        document.getElementById("hdr-sub").textContent = D.user.name + " · " + D.user.role;
        renderSummary();
        renderContent();
        document.getElementById("loading").style.display = "none";
        document.getElementById("main").style.display = "block";
      } catch(err) { showError("Render error: " + err.message); }
    })
    .catch(function(e) { clearTimeout(timeout); showError(e.message); });
}

// ── Data store ─────────────────────────────────────────────────────────────────
function put(data) { DRILL.push(data); return DRILL.length - 1; }
function D1(n) { drillItem(DRILL[n]); }

// ── Render ─────────────────────────────────────────────────────────────────────
function renderSummary() {
  var s = D.summary;
  var b = function(n, cls, lbl, fn) {
    if (!n) return "";
    return '<span class="badge ' + cls + '" onclick="' + fn + '">' + lbl + ': ' + n + '</span> ';
  };
  document.getElementById("summary-bar").innerHTML =
    b(s.overdue,  "badge-red",    "🔴 Overdue",  "drillGroup('overdue')") +
    b(s.dueToday, "badge-yellow", "🟡 Today",    "drillGroup('today')") +
    b(s.upcoming, "badge-green",  "🟢 Upcoming", "drillGroup('upcoming')") +
    '<span class="badge badge-blue">Total: ' + s.total + '</span>' +
    '<span class="badge badge-gray">✅ Done: ' + s.complete + '</span>';
}

function renderContent() {
  var html = "";

  D.people.forEach(function(pm) {
    var border = pm.overdue > 0 ? "has-overdue" : pm.dueToday > 0 ? "has-today" : "all-ok";
    var badges =
      (pm.overdue > 0  ? '<span class="badge badge-red">'    + pm.overdue  + ' overdue</span> ' : '') +
      (pm.dueToday > 0 ? '<span class="badge badge-yellow">' + pm.dueToday + ' today</span> '  : '') +
      (pm.upcoming > 0 ? '<span class="badge badge-green">'  + pm.upcoming + ' upcoming</span>': '') ||
      '<span class="badge badge-gray">No active items</span>';

    var id = "pc-" + pm.name.replace(/\W/g,"_");
    html += '<div class="person-card ' + border + '">' +
      '<div class="pc-hdr" onclick="toggleCard(\'' + id + '\')">' +
        '<div><div class="pc-name">👤 ' + esc(pm.name) + '</div>' +
          '<div style="font-size:11px;color:var(--muted);margin-top:2px">' + pm.total + ' total items</div></div>' +
        '<div class="pc-stats">' + badges + '</div>' +
      '</div>' +
      '<div class="pc-body" id="' + id + '">' +
        renderGroup("🔴 OVERDUE",   pm.overdueItems,  "overdue") +
        renderGroup("🟡 DUE TODAY", pm.dueTodayItems, "today") +
        renderGroup("🟢 UPCOMING",  pm.upcomingItems,  "ok") +
        renderGroup("⚪ NO DATE",   pm.noDateItems,    "gray") +
      '</div></div>';
  });

  // Sales bottlenecks section
  var m6 = D.metric6;
  if (m6 && m6.salesBottlenecks && m6.salesBottlenecks.length > 0) {
    var sbRows = m6.salesBottlenecks.slice(0, 15).map(function(i) {
      var n = put(i);
      return '<div class="item" onclick="D1(' + n + ')">' +
        '<div class="item-top">' +
          '<span class="item-customer">' + esc(i.person) + ' — ' + esc(i.customer) + '</span>' +
          '<span class="item-days ' + (i.alert ? "overdue" : "today") + '">' + (i.daysWaiting||0) + 'd</span>' +
        '</div>' +
        '<div class="item-sub">' + esc(i.product||"") + ' · ' + esc(i.team||"") + '</div>' +
        '<span class="item-ps">' + esc(i.currentStatus||"No action") + '</span></div>';
    }).join("");
    html += '<div class="section">' +
      '<div class="sec-hdr" onclick="toggleSec(\'sb\')">⏱ Sales Not Responding (' + m6.salesBottlenecks.length + ')<span>▼</span></div>' +
      '<div class="sec-body" id="sec-body-sb">' + sbRows + '</div></div>';
  }

  document.getElementById("content").innerHTML = html ||
    '<div style="padding:20px;text-align:center;color:var(--muted)">No active items found.</div>';
}

function renderGroup(title, items, cls) {
  if (!items || !items.length) return "";
  return '<div class="group-lbl">' + title + ' (' + items.length + ')</div>' +
    items.map(function(i) {
      var n = put(i);
      var dayCls = cls === "overdue" ? "overdue" : cls === "today" ? "today" : "ok";
      return '<div class="item" onclick="D1(' + n + ')">' +
        '<div class="item-top">' +
          '<span class="item-customer">' + esc(i.customer) + '</span>' +
          '<span class="item-days ' + dayCls + '">' + esc(i.daysInfo || i.promiseDate || "") + '</span>' +
        '</div>' +
        '<div class="item-sub">' + esc(i.product||"") + ' · ' + esc(i.rep||"") + (i.team ? ' (' + esc(i.team) + ')' : '') + '</div>' +
        (i.processStatus ? '<span class="item-ps">' + esc(i.processStatus) + '</span>' : '') +
      '</div>';
    }).join("");
}

// ── Drill-down ─────────────────────────────────────────────────────────────────
function drillGroup(groupName) {
  var allItems = [];
  D.people.forEach(function(pm) {
    var items = groupName==="overdue" ? pm.overdueItems :
                groupName==="today"   ? pm.dueTodayItems : pm.upcomingItems;
    (items||[]).forEach(function(i) { allItems.push(Object.assign({}, i, {purchPerson: pm.name})); });
  });
  allItems.sort(function(a,b){ return (b.daysOverdue||0) - (a.daysOverdue||0); });
  var lbl = groupName==="overdue"?"🔴 All Overdue":groupName==="today"?"🟡 Due Today":"🟢 Upcoming";
  dpOpen(lbl + " (" + allItems.length + ")", listHtml(allItems));
}

function drillItem(item) {
  var fields = [
    {l:"Customer",      v:item.customer},
    {l:"Product",       v:item.product},
    {l:"Rep",           v:item.rep},
    {l:"Team",          v:item.team},
    {l:"Purch Person",  v:item.purchPerson||item.person},
    {l:"Process Status",v:item.processStatus},
    {l:"Status",        v:item.currentStatus||item.status},
    {l:"Promise Date",  v:item.promiseDate},
    {l:"Days Info",     v:item.daysInfo||(item.daysOverdue!=null?item.daysOverdue+"d overdue":null)},
    {l:"Days Waiting",  v:item.daysWaiting!=null?item.daysWaiting+"d":null},
  ].filter(function(f){ return f.v!=null && f.v!==""; });

  var html = '<div style="background:#fff;border-radius:8px;padding:14px">' +
    fields.map(function(f){
      return '<div style="padding:6px 0;border-bottom:1px solid #f1f5f9;display:flex;gap:10px">' +
        '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;width:110px;flex-shrink:0;padding-top:1px">' + esc(f.l) + '</div>' +
        '<div style="font-size:12px;font-weight:600">' + esc(String(f.v)) + '</div></div>';
    }).join("") + '</div>';

  if (document.getElementById("dp").classList.contains("open")) dpPush(item.customer||"Detail", html);
  else dpOpen(item.customer||"Detail", html);
}

function listHtml(items) {
  if (!items.length) return '<div style="padding:20px;text-align:center;color:var(--muted)">No items</div>';
  return items.map(function(i) {
    var n = put(i);
    var days = i.daysOverdue!=null ? i.daysOverdue+"d overdue" : i.daysInfo||"";
    var cls  = (i.daysOverdue>0||i.alert) ? "badge-red" : "badge-yellow";
    return '<div style="padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;background:#fff" onclick="D1(' + n + ')">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start">' +
        '<span style="font-weight:600;font-size:12px;color:var(--blue);text-decoration:underline;text-decoration-style:dotted">' + esc(i.customer) + '</span>' +
        (days?'<span class="badge ' + cls + '">' + esc(days) + '</span>':'') +
      '</div>' +
      '<div style="font-size:11px;color:var(--muted);margin-top:2px">' + esc(i.product||"") + (i.rep?' · '+esc(i.rep):'') + '</div>' +
      (i.purchPerson?'<div style="font-size:10px;color:var(--muted)">👤 '+esc(i.purchPerson)+'</div>':'') +
    '</div>';
  }).join("");
}

// ── Panel navigation ───────────────────────────────────────────────────────────
function dpOpen(title, html) {
  SAVED_SCROLL = window.scrollY;
  STACK = [{title:title, html:html}];
  dpShow(title, html);
  document.getElementById("dp").classList.add("open");
}

function dpPush(title, html) {
  STACK.push({title:title, html:html});
  dpShow(STACK.map(function(s){return s.title;}).join(" › "), html);
}

function dpShow(crumb, html) {
  document.getElementById("dp-crumb").textContent = crumb;
  document.getElementById("dp-body").innerHTML = html;
  document.getElementById("dp-body").scrollTop = 0;
}

function drillBack() {
  if (STACK.length <= 1) {
    STACK = [];
    document.getElementById("dp").classList.remove("open");
    window.scrollTo(0, SAVED_SCROLL);
  } else {
    STACK.pop();
    var prev = STACK[STACK.length-1];
    dpShow(STACK.map(function(s){return s.title;}).join(" › "), prev.html);
  }
}

// ── Utilities ─────────────────────────────────────────────────────────────────
function toggleCard(id) { var el=document.getElementById(id); if(el) el.classList.toggle("open"); }
function toggleSec(id)  { var b=document.getElementById("sec-body-"+id); if(b) b.classList.toggle("open"); }

function showError(msg) {
  document.getElementById("loading").style.display = "none";
  document.getElementById("error-view").style.display = "block";
  document.getElementById("error-view").innerHTML =
    '<div style="font-size:15px;font-weight:700;margin-bottom:8px">⚠️ Error</div>' +
    '<div class="err-box">' + esc(msg) + '</div>';
}

function toast(msg) {
  var el=document.getElementById("toast");
  el.textContent=msg; el.classList.add("show");
  setTimeout(function(){ el.classList.remove("show"); }, 2500);
}

function esc(s) {
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function jsonpCall(url) {
  return new Promise(function(resolve, reject) {
    var fn="cb_"+Date.now()+Math.random().toString(36).slice(2);
    var s=document.createElement("script");
    var timer=setTimeout(function(){ cleanup(); reject(new Error("Request timed out")); }, 25000);
    window[fn]=function(data){ clearTimeout(timer); cleanup(); resolve(data); };
    s.onerror=function(){ clearTimeout(timer); cleanup(); reject(new Error("Network error")); };
    function cleanup(){ delete window[fn]; s.parentNode&&s.parentNode.removeChild(s); }
    s.src=url+(url.includes("?")?"&":"?")+"callback="+fn;
    document.head.appendChild(s);
  });
}
</script>
</body>
</html>
